; What Godot draws in place of Doom's own art. Anything not listed here
; draws as in Doom. Assets come from easel: its specs are in art/ at the
; top of the repository, and it builds them into res://assets/.
;
; [textures] and [flats]: a wall texture or a flat, by its name in the
; WAD, to a material, easel's StandardMaterial3D (.tres). The material
; covers one repeat of what it replaces: 128x128 STARG3 is 4 m square,
; a 64x64 flat 2 m. It moves, pegs and animates as the texture would,
; and Doom's light still lights it.
;
; [sprites]: a thing's sprite, by its four letter name, to a prop, a
; GLB scene standing on the thing's spot and turned the way it faces
; (its front is -z). Keyed by sprite, not by type, since a type's
; states use several sprites: a barrel stands as BAR1 and bursts as
; BEXP, so a prop for BAR1 gives way to Doom's own burst. Lit as Doom
; lights the sprite: full bright frames stay full bright.

[textures]
STARG3="res://assets/textures/starg3.tres"

[flats]
FLOOR0_3="res://assets/textures/floor0_3.tres"

[sprites]
COLU="res://assets/props/colu.glb"
